# rpi_clock.cfg  —  Configuration for rpi_clock.py
# Generated by configure.sh — edit carefully.
# Lines beginning with # are comments.

[openweathermap]

# Your OpenWeatherMap API key (free tier is fine).
api_key = YOUR_API_KEY_HERE

# Location query — use ONE of the formats below:
#   By city name:    q=Adelaide,au
#   By ZIP/postcode: zip=5000,au   (zip=75248,us for US)
location = q=Adelaide,au

# Temperature units: metric (°C, km/h) or imperial (°F, mph)
units = metric


[display]

# Run fullscreen (True) or in a window (False — useful for testing).
fullscreen = True

# Screen resolution — Waveshare 3.5" (A) is 480x320.
width  = 480
height = 320

# Time format (strftime codes).  24-hour: %H:%M:%S   12-hour: %I:%M:%S %p
time_format = %H:%M:%S

# Date format.
date_format = %A  %d %B %Y


[colours]

# Colour theme. Options:
#   dark_blue  — dark navy background, white/blue text  (default)
#   black      — pure black background, white/grey text
#   dark_green — dark green background, white/green text
#   red        — dark red background, white/pink text
#   orange     — dark orange background, white/amber text
#   yellow     — dark yellow background, white/yellow text
#   white      — light grey background, dark text (icon badge enabled)
theme = dark_blue
